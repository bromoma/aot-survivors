<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;height:100%;background:#0b0d14;overflow:hidden}canvas{display:block}</style></head>
<body><script>window.onerror=(m,s,l,c,e)=>{document.body.setAttribute('data-err',m+' @'+l+':'+c+' '+(e&&e.stack||'').slice(0,400))};window.requestAnimationFrame=()=>0;window.ASSET_BASE='../';window.addEventListener('unhandledrejection',e=>{document.body.setAttribute('data-err','REJ '+(e.reason&&(e.reason.message+' '+(e.reason.stack||'').slice(0,300))))});</script>
<canvas id="game"></canvas>
<script src="../src/core.js"></script><script src="../src/terrain.js"></script><script src="../src/fx.js"></script>
<script src="../src/assets.js"></script><script src="../src/audio.js"></script><script src="../src/combat.js"></script><script src="../src/meta.js"></script><script src="../src/game.js"></script>
<script>
const LOG = []; let DEATHS = 0;
const log = s => LOG.push(s);
const [fac, secs, mode] = (location.hash.slice(1) || '1,30,play').split(',');
const HS = location.hash;
function finish() {
  render();
  const o = document.createElement('pre'); o.id = 'snap'; o.textContent = canvas.toDataURL('image/png'); document.body.appendChild(o);
  const l = document.createElement('pre'); l.id = 'log'; l.textContent = LOG.join(' | '); document.body.appendChild(l);
}
function bot(i) {
  const t = nearestTitan(5000);
  for (const k of ['KeyW', 'KeyA', 'KeyS', 'KeyD']) keys[k] = false;
  if (!t) return;
  const dx = t.x - player.x, dy = t.y - player.y, d = Math.hypot(dx, dy);
  let mx = dx, my = dy;
  if (HS.includes('smart') && d < 380) { mx = -dy; my = dx; if (player.z < reqZ(t)) { mx -= dx * 0.6; my -= dy * 0.6; } }
  if (Math.abs(mx) > 60) keys[mx > 0 ? 'KeyD' : 'KeyA'] = true;
  if (Math.abs(my) > 60) keys[my > 0 ? 'KeyS' : 'KeyW'] = true;
  if (d < 700 && i % 20 === 0) engage();
}
const FP = {};
function prof() {
  for (const fn of ["drawParticles","drawTitan","drawBuilding","drawTree","drawProp","drawCiv","drawPlayer","drawHud","drawWorldTexts","drawTitanDecals","drawSlashes","drawRope","variant","disc","drawWorld"]) {
    let orig; try { orig = eval(fn); } catch (e) { continue; }
    const w = function(...a) { const t = performance.now(); const r = orig.apply(this, a); FP[fn] = (FP[fn] || 0) + performance.now() - t; return r; };
    eval(fn + " = w");
  }
}
const HURT = {}; const BOSSLOG = [];
function runTest() {
  const oh = hurtPlayer; hurtPlayer = function (t) { if (player.inv <= 0) { const k = t && t.boss ? t.boss.kind : t && t.H ? 'titan' : 'rock'; HURT[k] = (HURT[k] || 0) + 1; } return oh(t); };
  const ob = bossHit; bossHit = function (t) { BOSSLOG.push(t.boss.kind + ' hit@' + game.time.toFixed(0) + ' hp' + (t.boss.hp - 1)); return ob(t); };
  const os = spawnBoss; spawnBoss = function (d, c) { BOSSLOG.push(d.kind + ' spawn@' + game.time.toFixed(0)); return os(d, c); };
  if (HS.includes("prof")) prof();
  let t0 = performance.now();
  factionSel = +fac; worldUsed = true; reset();
  log('world gen ' + FACTIONS[+fac].id + ': ' + (performance.now() - t0).toFixed(0) + 'ms, buildings ' + buildings.length + ', trees ' + trees.length + ', props ' + props.length);
  if (mode === 'play') {
    start();
    let upd = 0, rnd = 0, rn = 0, worst = 0, snapAt = -1;
    const N = 60 * (+secs);
    for (let i = 0; i < N; i++) {
      if (HS.includes('bot')) {
        bot(i);
        if ((HS.includes('orbit') || HS.includes('cut') || HS.includes('bosssnap')) && game.time > (+secs) * 0.5 && (HS.includes('bosssnap') ? game.boss && Math.hypot(game.boss.x - player.x, game.boss.y - player.y) < 500 : true) && player.mode === 'attack' && player.phase === (HS.includes('orbit') ? 'orbit' : 'cut')) { snapAt = i; break; }
      } else if (i % 75 === 0) engage();
      let a = performance.now();
      update(1 / 60);
      upd += performance.now() - a;
      if (state === 'levelup') choose(0);
      if (state === 'over') { if (!DEATHS) log('FIRSTDEATH ' + game.time.toFixed(0) + ' lvl ' + game.level); DEATHS++; state = 'play'; player.hp = 5; }
      if (i % 3 === 0) { a = performance.now(); render(); const d = performance.now() - a; rnd += d; rn++; worst = Math.max(worst, d); if (d > 120) log(`slow ${d.toFixed(0)}ms t=${game.time.toFixed(1)} ` + JSON.stringify(Object.fromEntries(Object.entries(FP).filter(([k, v]) => v > 3).map(([k, v]) => [k, Math.round(v)])))); for (const k in FP) delete FP[k]; }
    }
    if (HS.includes('meta')) { if (state === 'play') finishRun(false); log(`META tokens ${save.tokens} reward ${game.reward} state ${state} t ${game.time.toFixed(0)} | done ${achievementsState().filter(a => a.done).map(a => a.id).join(',')} | daily ${JSON.stringify(dailyState().map(t => t.value + '/' + t.goal))} | stats ${JSON.stringify(save.stats)}`); }
    log(`skills ${JSON.stringify(stats.skills)} pass ${JSON.stringify(stats.pass)} bossIdx ${game.bossIdx} bossKills ${game.bossKills} boss ${game.boss ? game.boss.boss.kind + ' hp' + game.boss.boss.hp : '-'} deaths ${DEATHS} hurt ${JSON.stringify(HURT)} | ${BOSSLOG.join(', ')}`); log(`sim: update ${(upd / N).toFixed(2)}ms, render avg ${(rnd / rn).toFixed(2)}ms worst ${worst.toFixed(0)}ms, titans ${titans.length}, kills ${game.kills}, snapAt ${snapAt}`);
    const a = performance.now();
    for (let i = 0; i < 20; i++) render();
    log('steady ' + ((performance.now() - a) / 20).toFixed(2) + 'ms');
  }
  finish();
}
const wait = setInterval(() => { if (player) { clearInterval(wait); try { runTest(); } catch (e) { document.body.setAttribute('data-err', e.message + ' ' + (e.stack || '').slice(0, 300)); finish(); } } }, 50);
</script></body></html>
