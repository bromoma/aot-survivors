<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<script>window.onerror=(m,s,l)=>document.body.setAttribute('data-err',m+' @'+l);window.ASSET_BASE='../';</script>
<canvas id="c" width="1400" height="420"></canvas>
<script src="../src/core.js"></script><script src="../src/i18n.js"></script><script src="../src/assets.js"></script>
<script>
const keys = (location.hash.slice(1) || 'jaw,cart').split(',');
Promise.all(keys.flatMap(k => ['up', 'up'].map((d, j) => new Promise(r => { const im = new Image(); im.onload = () => r([k, j, im]); im.src = '../assets/sprites/boss_' + k + '_up.png'; })))).then(list => {
  const g = document.getElementById('c').getContext('2d'); g.fillStyle = '#56603a'; g.fillRect(0, 0, 1400, 420);
  let x = 10;
  for (const [k, j, im] of list) { const c = toCanvas(im); if (j) scrubMark(c); g.drawImage(c, x, 10, c.width * 1.3, c.height * 1.3); x += c.width * 1.3 + 10; }
  const o = document.createElement('pre'); o.id = 'snap'; o.textContent = document.getElementById('c').toDataURL(); document.body.appendChild(o);
});
</script></body></html>
