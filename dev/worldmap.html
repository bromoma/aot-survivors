<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<script>window.onerror=(m,s,l)=>document.body.setAttribute('data-err',m+' @'+l);window.requestAnimationFrame=()=>0;window.ASSET_BASE='../';</script>
<canvas id="game"></canvas>
<script src="../src/core.js"></script><script src="../src/i18n.js"></script><script src="../src/terrain.js"></script><script src="../src/fx.js"></script>
<script src="../src/assets.js"></script><script src="../src/audio.js"></script><script src="../src/combat.js"></script><script src="../src/meta.js"></script><script src="../src/heroes.js"></script><script src="../src/gacha.js"></script><script src="../src/world.js"></script><script src="../src/juice.js"></script><script src="../src/game.js"></script>
<script>
const wait = setInterval(() => {
  if (!player) return;
  clearInterval(wait);
  const kind = location.hash.slice(1) || 'city', R = 5, S = 8;
  const t0 = performance.now();
  worldReset(kind, 12345);
  let n = 0;
  for (let cy = -R; cy < R; cy++) for (let cx = -R; cx < R; cx++) { genChunk(cx, cy); n++; }
  const ms = (performance.now() - t0) / n;
  const out = document.createElement('canvas'); out.width = out.height = R * 2 * CN / S * 2;
  const g = out.getContext('2d');
  const k = 2 / S;
  for (const ch of chunks.values()) {
    g.drawImage(ch.canvas, (ch.cx + R) * CN * k, (ch.cy + R) * CN * k, CN * k, CN * k);
    g.fillStyle = kind === 'ruins' ? '#7a3a2a' : '#b0402a';
    for (const b of ch.buildings) g.fillRect((b.x / ART + R * CN) * k, (b.y / ART + R * CN) * k, Math.max(2, b.w / ART * k), Math.max(2, b.d / ART * k * 1.8));
    g.fillStyle = '#0d3a12';
    for (const t of ch.trees) g.fillRect((t.x / ART + R * CN) * k - 1, (t.y / ART + R * CN) * k - 1, 3, 3);
  }
  g.fillStyle = '#fff'; g.fillRect(R * CN * k - 3, R * CN * k - 3, 6, 6);
  const o = document.createElement('pre'); o.id = 'snap'; o.textContent = out.toDataURL(); document.body.appendChild(o);
  const l = document.createElement('pre'); l.id = 'log'; l.textContent = kind + ' chunk avg ' + ms.toFixed(1) + 'ms ' + JSON.stringify(Object.fromEntries(Object.entries(GEN_PROF).map(([k, v]) => [k, +(v / GEN_PROF.n).toFixed(1)]))); document.body.appendChild(l);
}, 50);
</script></body></html>
